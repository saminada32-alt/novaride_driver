name: Release (signed Android build)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Recreates the real signing keystore from a base64 secret. The file
      # never touches the repo or an artifact — it only exists on this runner.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See android/app/build.gradle.kts — release builds refuse to fall back to debug signing." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Recreates config/prod.json (gitignored) from a single JSON secret,
      # matching the --dart-define-from-file convention used everywhere else
      # in this app (see lib/core/config/app_config.dart).
      - name: Restore prod app config
        env:
          FLUTTER_PROD_CONFIG_JSON: ${{ secrets.FLUTTER_PROD_CONFIG_JSON }}
        run: |
          if [ -z "$FLUTTER_PROD_CONFIG_JSON" ]; then
            echo "::error::FLUTTER_PROD_CONFIG_JSON secret is not set (should contain the full contents of config/prod.json)." >&2
            exit 1
          fi
          echo "$FLUTTER_PROD_CONFIG_JSON" > config/prod.json

      - name: Build release App Bundle (.aab, for Play Store)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: flutter build appbundle --release --dart-define-from-file=config/prod.json

      - name: Build release APK (for manual/sideload distribution)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: flutter build apk --release --dart-define-from-file=config/prod.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novaride-driver-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 90
